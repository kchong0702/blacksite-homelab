version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /terraform/environments/*/*
      - /terraform/modules/*/*
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(terraform)
    groups:
      providers:
        patterns: ["*"]
