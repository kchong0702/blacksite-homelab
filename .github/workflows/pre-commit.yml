name: Pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v5.2.7

      - name: Run hooks
        run: pre-commit run --all-files
