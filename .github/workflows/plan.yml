name: Plan

on:
  pull_request:
    paths: [terraform/**, .github/workflows/plan.yml, .github/workflows/reusable-terraform.yml, .github/workflows/reusable-gates.yml]

permissions:
  contents: read

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  infrastructure:
    if: vars.ACTIVE_CLOUD != '' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      command: plan
      stacks: ${{ format('["global/tailscale","global/cloudflare","prod/cloudflare","prod/{0}"]', vars.ACTIVE_CLOUD) }}
    secrets: inherit

  gates:
    if: vars.ACTIVE_CLOUD != '' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/reusable-gates.yml
    secrets: inherit

  databases:
    needs: gates
    if: needs.gates.outputs.hosts != '0' && needs.gates.outputs.bytebase == 'true'
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      command: plan
      stacks: '["prod/bytebase"]'
      tailnet: true
    secrets: inherit
