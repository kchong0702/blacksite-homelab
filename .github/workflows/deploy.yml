name: Deploy

on:
  pull_request:
    paths: [terraform/**, ansible/**, .github/workflows/deploy.yml]
  push:
    branches: [main]
    paths: [terraform/**, ansible/**, .github/workflows/deploy.yml]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}

jobs:
  infrastructure:
    if: vars.ACTIVE_CLOUD != ''
    runs-on: ubuntu-latest

    strategy:
      fail-fast: ${{ github.event_name != 'pull_request' }}
      max-parallel: 1
      matrix:
        stack: ${{ fromJSON(format('["global/tailscale","global/cloudflare","prod/cloudflare","prod/{0}"]', vars.ACTIVE_CLOUD)) }}

    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.stack }}

    env:
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      TAILSCALE_TAILNET: ${{ vars.TAILSCALE_TAILNET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      CNTB_OAUTH2_CLIENT_ID: ${{ secrets.CNTB_OAUTH2_CLIENT_ID }}
      CNTB_OAUTH2_CLIENT_SECRET: ${{ secrets.CNTB_OAUTH2_CLIENT_SECRET }}
      CNTB_OAUTH2_USER: ${{ secrets.CNTB_OAUTH2_USER }}
      CNTB_OAUTH2_PASS: ${{ secrets.CNTB_OAUTH2_PASS }}
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v5.2.7

      - name: Init
        run: terraform init -input=false

      - name: Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false

      - name: Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve

  gates:
    needs: infrastructure
    runs-on: ubuntu-latest

    outputs:
      hosts: ${{ steps.hosts.outputs.count }}
      bytebase: ${{ steps.bytebase.outputs.ready }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v5.2.7

      - name: Count the hosts in the active cloud
        id: hosts
        working-directory: terraform/environments/prod/${{ vars.ACTIVE_CLOUD }}
        run: |
          terraform init -input=false
          echo "count=$(terraform output -json | jq '.instance_ids.value // {} | length')" >> "$GITHUB_OUTPUT"

      - name: Check for the Bytebase service account
        id: bytebase
        env:
          BYTEBASE_SERVICE_KEY: ${{ secrets.BYTEBASE_SERVICE_KEY }}
        run: |
          if [ -n "$BYTEBASE_SERVICE_KEY" ]; then echo "ready=true"; else echo "ready=false"; fi >> "$GITHUB_OUTPUT"

  configuration:
    needs: gates
    if: github.event_name != 'pull_request' && needs.gates.outputs.hosts != '0'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v5.2.7

      - name: Read the Cloudflare credentials from Terraform
        working-directory: terraform/environments/prod/cloudflare
        run: |
          terraform init -input=false
          for pair in CLOUDFLARE_TUNNEL_TOKEN=tunnel_token CLOUDFLARE_DNS_API_TOKEN=caddy_dns_token R2_ACCESS_KEY_ID=backups_access_key_id R2_SECRET_ACCESS_KEY=backups_secret_access_key; do
            value=$(terraform output -raw "${pair#*=}")
            echo "::add-mask::$value"
            echo "${pair%%=*}=$value" >> "$GITHUB_ENV"
          done

      - name: Join the tailnet
        uses: tailscale/github-action@v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:infra-ci

      - name: Install collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run the playbook
        working-directory: ansible
        run: ansible-playbook playbooks/site.yml --user root
        env:
          BYTEBASE_POSTGRES_PASSWORD: ${{ secrets.BYTEBASE_POSTGRES_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPS_DATABASE_URL: ${{ secrets.OPS_DATABASE_URL }}

  databases:
    needs: [gates, configuration]
    if: >-
      !cancelled()
      && needs.gates.result == 'success'
      && needs.gates.outputs.hosts != '0'
      && needs.gates.outputs.bytebase == 'true'
      && needs.configuration.result != 'failure'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/prod/bytebase

    env:
      BYTEBASE_URL: ${{ vars.BYTEBASE_URL }}
      BYTEBASE_SERVICE_ACCOUNT: ${{ secrets.BYTEBASE_SERVICE_ACCOUNT }}
      BYTEBASE_SERVICE_KEY: ${{ secrets.BYTEBASE_SERVICE_KEY }}
      TF_VAR_ops_api_db_username: ${{ secrets.OPS_API_DB_USERNAME }}
      TF_VAR_ops_api_db_password: ${{ secrets.OPS_API_DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v5.2.7

      - name: Join the tailnet
        uses: tailscale/github-action@v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:infra-ci

      - name: Init
        run: terraform init -input=false

      - name: Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false

      - name: Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve
