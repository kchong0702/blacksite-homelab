- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    update_cache: true
    cache_valid_time: 3600

- name: Deny incoming traffic by default
  ansible.builtin.command: ufw default deny incoming
  changed_when: false

- name: Allow incoming traffic on tailscale0
  ansible.builtin.command: ufw allow in on tailscale0
  changed_when: false

- name: Enable ufw
  ansible.builtin.command: ufw --force enable
  changed_when: false
