- name: Prepare every host
  hosts: all
  become: true
  roles:
    - tailscale
    - base
    - docker

- name: Configure the app servers
  hosts: app_servers
  become: true
  roles:
    - app_host
    - caddy
    - cloudflared

- name: Configure the Bytebase servers
  hosts: bytebase_servers
  become: true
  roles:
    - bytebase

- name: Configure the backup servers
  hosts: backup_servers
  become: true
  roles:
    - pg_backup
